# ============================================================
#  EternalClash2 — CI/CD Pipeline
#  Build → Test → Deploy (อัตโนมัติ)
# ============================================================
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/eternalclash2

jobs:
  # ──────────────────────────────────────────────
  #  Stage 1: Build
  # ──────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 📦 Build with Maven (skip tests)
        working-directory: ./code
        run: mvn clean package -DskipTests -B

      - name: 💾 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: code/target/*.jar
          retention-days: 1

  # ──────────────────────────────────────────────
  #  Stage 2: Test
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eternalclash2_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 🧪 Run tests
        working-directory: ./code
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eternalclash2_test
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: mvn test -B

      - name: 📊 Generate Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: code/target/surefire-reports/*.xml
          reporter: java-junit

      - name: 📈 Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: code/target/surefire-reports/
          retention-days: 7

  # ──────────────────────────────────────────────
  #  Stage 3: Build & Push Docker Image
  # ──────────────────────────────────────────────
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 📦 Build JAR
        working-directory: ./code
        run: mvn clean package -DskipTests -B

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  #  Stage 4: Deploy to Render
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🚀 Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
        # ──────────────────────────────────────
        # ทางเลือกอื่น (ลบ comment ที่ต้องการใช้):
        # ──────────────────────────────────────
        # Railway:
        #   curl -X POST "https://backboard.railway.app/graphql/v2" \
        #     -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
        #     -H "Content-Type: application/json" \
        #     -d '{"query":"mutation { deploymentTrigger { id } }"}'
        #
        # Fly.io:
        #   uses: superfly/flyctl-actions/setup-flyctl@master
        #   run: flyctl deploy --remote-only

      - name: ✅ Deploy success notification
        run: echo "🎉 Deployed successfully to production!"
